name = "manga-images"
main = "src/index.js"
compatibility_date = "2026-11-01"
# workers.dev のアドレスで公開する。確認用の別アドレス（プレビュー）は作らない。
workers_dev = true
preview_urls = false

# 非公開の R2 バケット。Worker からだけ読み書きする。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "manga-images"

[vars]
# アプリを開く場所。ここ以外のサイトからの呼び出しはブラウザが拒否する。
ALLOWED_ORIGINS = "https://takuspec.github.io,http://localhost:5173"
# 使用状況（操作回数）の取得に使うバケット名。上の bucket_name と同じにする。
BUCKET_NAME = "manga-images"

# 次の値は秘密なのでここには書かない。README の手順で登録する。
#   AUTH_TOKEN     アプリに入力する合言葉（必須）
#   CF_API_TOKEN   操作回数の取得用 API トークン（任意）
#   CF_ACCOUNT_ID  Cloudflare のアカウント ID（任意）
